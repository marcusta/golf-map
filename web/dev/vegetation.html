<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegetation test scene</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #d9d5cb; font: 13px/1.4 system-ui, sans-serif; color: #111; }
        #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
        #panel {
            position: absolute; top: 8px; right: 8px; width: 300px; padding: 10px 12px;
            background: #ffffff; color: #111; border: 1px solid #333; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.25);
            display: flex; flex-direction: column; gap: 6px; max-height: calc(100% - 16px); overflow: auto;
        }
        #panel h1 { font-size: 14px; margin: 0 0 4px; }
        .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .label { width: 72px; flex-shrink: 0; font-weight: 600; }
        .value { font-family: ui-monospace, monospace; font-size: 12px; }
        input[type=range] { flex: 1; min-width: 100px; }
        button { font: inherit; padding: 2px 8px; background: #f2f2f2; border: 1px solid #555; border-radius: 3px; cursor: pointer; }
        button:hover { background: #e2e2e2; }
        select { font: inherit; }
        .stats { margin: 4px 0 0; padding: 6px 8px; background: #f4f4f0; border: 1px solid #999; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
        .hint { font-size: 11px; color: #444; }
        #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
        .tag[data-group=ladder] { background: rgba(255,244,190,.92); }
        .tag { position: absolute; left: 0; top: 0; padding: 1px 5px; background: rgba(255,255,255,.9); color: #111; border: 1px solid #333; border-radius: 3px; font: 11px/1.3 ui-monospace, monospace; white-space: nowrap; }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="panel" data-testid="vegetation-panel">
        <h1>Vegetation test scene</h1>
        <div class="hint">Drag: orbit. Shift-drag or right-drag: pan. Wheel: distance. State persists in localStorage.</div>
    </div>
    <script type="module" src="../src/vegetation/main.ts"></script>
</body>
</html>
