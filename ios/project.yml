# XcodeGen source of truth for the iOS app.
# Regenerate the (gitignored) Xcode project with:  cd ios && xcodegen generate
# Docs: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: GolfMap

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

# Swift Package Manager dependencies (resolved by Xcode on first build).
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    from: 6.27.0
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0

targets:
  GolfMap:
    type: application
    platform: iOS
    sources:
      - GolfMap
      # Watch sync payload — one source of truth compiled into both apps.
      - GolfMapWatchShared
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: GRDB
        product: GRDB
      # Embeds the watch app so WatchConnectivity pairs the two.
      - target: GolfMapWatch
    # Info.plist is generated by XcodeGen at GolfMap/Info.plist (gitignored).
    # Edit these properties here, not the generated file.
    info:
      path: GolfMap/Info.plist
      properties:
        # Expanded at build time — deploy-ios.sh stamps this with the deploy
        # timestamp so the installed build is verifiable on-device.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # iPhone only, portrait primary.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Shows live distances from your position on the course.
        # ARKit LiDAR corridor scanning (task E1) uses the camera + LiDAR to
        # measure the green surface along the putt line.
        NSCameraUsageDescription: Scans the green surface along your putt line with the camera and LiDAR to read the break.
        # Spot-level green capture lays the phone flat and reads gravity-anchored
        # tilt from the motion sensors.
        NSMotionUsageDescription: Reads the phone's tilt when you lay it flat on the green to measure slope.
        # Voice pin entry captures a short phrase from the mic and transcribes it
        # with on-device speech recognition (audio never leaves the phone).
        NSMicrophoneUsageDescription: Captures a short voice phrase to place today's pin (e.g. "4 from front, 5 from left").
        NSSpeechRecognitionUsageDescription: Transcribes your pin phrase on-device — audio never leaves the phone.
        # Dev server runs on http://localhost:3000. Allow local networking ONLY —
        # do not widen to NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcusandersson.golfmap
        # Paid Apple Developer team (active since 2026-07); automatic signing
        # lets xcodebuild -allowProvisioningUpdates register devices and mint
        # profiles on demand.
        DEVELOPMENT_TEAM: AC979WJ4JA
        CODE_SIGN_STYLE: Automatic
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        # Swift 6 language mode already implies complete concurrency checking;
        # set explicitly so it survives a language-mode downgrade.
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    # Generates the GolfMap scheme with GolfMapTests wired into the test action.
    scheme:
      testTargets:
        - GolfMapTests

  # Watch companion app (runs independently during the round — the phone can
  # be dead): synced course data + live green distances, plus the mark-shot
  # distance tracker. Distance readouts come from the watch's own GPS; the
  # phone only ever syncs static course bundles over WatchConnectivity.
  GolfMapWatch:
    type: application
    platform: watchOS
    sources:
      - GolfMapWatch
      - GolfMapWatchShared
      # Shared geo math (same planar EPSG:3006 meters as phone + web).
      - path: GolfMap/Geo/LatLon.swift
      - path: GolfMap/Geo/Sweref99TM.swift
      - path: GolfMap/Geo/Distance.swift
      - path: GolfMap/Geo/PlaysLike.swift
    info:
      path: GolfMapWatch/Info.plist
      properties:
        WKApplication: true
        # Paired with the iOS app for course sync, but fully functional
        # standalone during a round.
        WKCompanionAppBundleIdentifier: com.marcusandersson.golfmap
        WKRunsIndependentlyOfCompanionApp: true
        NSLocationWhenInUseUsageDescription: Shows live distances to the green and how far you have walked from your marked shot.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcusandersson.golfmap.watch
        DEVELOPMENT_TEAM: AC979WJ4JA
        CODE_SIGN_STYLE: Automatic
        # Apple Watch only.
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    scheme:
      testTargets:
        - GolfMapWatchTests

  GolfMapWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - GolfMapWatchTests
    dependencies:
      - target: GolfMapWatch
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: true

  GolfMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GolfMapTests
    dependencies:
      - target: GolfMap
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Test bundles need an Info.plist; let Xcode synthesize it.
        GENERATE_INFOPLIST_FILE: true
